name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, APK, lint
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: floor-level-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload rendered screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-screens
          path: app/build/screens/
